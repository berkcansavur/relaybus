name: Docs

# Builds the VitePress site in docs-site/ and deploys it to GitHub Pages.
# One-time repository setting: Settings > Pages > Build and deployment > Source = GitHub Actions.

on:
  push:
    branches: [main]
    paths:
      - docs-site/**
      - packages/*/README.md
      - packages/*/package.json
      - README.md
      - scripts/build-docs-assets.mjs
      - pnpm-lock.yaml
      - .github/workflows/docs.yml
  workflow_dispatch:

# A started deployment is never cancelled, and only the latest queued run waits.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read # configure-pages reads the Pages site settings
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup toolchain
        uses: ./.github/actions/setup
        with:
          install: 'false'

      - name: Install documentation dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts --filter relaybus-docs

      - name: Check generated files (llms.txt, README snippets) are up to date
        run: pnpm --filter relaybus-docs docs:check

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build site
        run: pnpm --filter relaybus-docs docs:build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs-site/.vitepress/dist

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write # publish the Pages deployment
      id-token: write # prove to Pages that the deployment comes from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
