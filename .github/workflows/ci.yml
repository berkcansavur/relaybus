name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Reused by release.yml as the pre-publish gate.
  workflow_call:
    inputs:
      skip-coverage-upload:
        description: Skip the Codecov upload (used by the release gate).
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup workspace
        uses: ./.github/actions/setup

      - name: Prettier
        run: pnpm format:check

      - name: ESLint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # perf-budgets.json is a ratchet: a pull request may lower budgets, never raise or drop one.
      - name: Performance budgets
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "$GITHUB_BASE_REF"
          node scripts/check-perf-budgets.mjs FETCH_HEAD

  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # id-token is needed for Codecov OIDC (no CODECOV_TOKEN secret required).
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        node: ['22.x', '24.x']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup workspace
        uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node }}

      - name: Verify Docker (Testcontainers)
        run: docker version --format '{{.Server.Version}}'

      # Runs the unit and integration projects together and fails when any
      # 100% threshold from vitest.config.ts is not met.
      - name: Test with coverage
        run: pnpm coverage

      - name: Upload coverage artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-node-${{ matrix.node }}
          path: |
            coverage/lcov.info
            coverage/coverage-summary.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload coverage to Codecov
        if: ${{ !cancelled() && !inputs.skip-coverage-upload }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: ./coverage/lcov.info
          disable_search: true
          flags: node-${{ matrix.node }}
          fail_ci_if_error: false

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup workspace
        uses: ./.github/actions/setup

      - name: Build all packages
        run: pnpm build

      - name: Typecheck each package build
        run: pnpm -r run typecheck

      # Fails when an exported declaration changed but packages/*/etc/*.api.md was
      # not regenerated (`pnpm api:report`) and committed with the change.
      - name: Check public API reports (API Extractor)
        run: pnpm api:check

      - name: Lint package manifests (publint)
        run: pnpm -r --filter "./packages/*" exec publint .

      - name: Check type resolution (attw)
        run: pnpm -r --filter "./packages/*" exec attw --pack .

      # Installing @relaybus/postgres into an app on Prisma 5 must keep that app's Prisma Client.
      - name: Check the install next to Prisma 5
        run: node scripts/check-prisma-install.mjs 5.22.0

  nestjs-compat:
    name: nestjs compat (@nestjs/* ${{ matrix.nest }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        nest: ['11', '12']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup workspace
        uses: ./.github/actions/setup
        with:
          node-version: 24.x

      # CI-only: re-resolve the dev dependencies of the nestjs package to the
      # matrix major. The modified package.json and lockfile are never committed.
      - name: Pin @nestjs/* to ${{ matrix.nest }}
        run: >
          pnpm --filter @relaybus/nestjs add --save-dev
          @nestjs/common@${{ matrix.nest }}
          @nestjs/core@${{ matrix.nest }}
          @nestjs/testing@${{ matrix.nest }}

      - name: Show resolved versions
        run: pnpm --filter @relaybus/nestjs list @nestjs/common @nestjs/core @nestjs/testing

      - name: Assert resolved major
        run: |
          actual="$(node -p "require('./packages/nestjs/node_modules/@nestjs/common/package.json').version")"
          echo "@nestjs/common resolved to ${actual}"
          case "${actual}" in
            "${{ matrix.nest }}".*) ;;
            *) echo "Expected @nestjs/common ${{ matrix.nest }}.x" >&2; exit 1 ;;
          esac

      - name: Typecheck against @nestjs/* ${{ matrix.nest }}
        run: pnpm typecheck

      - name: Test packages/nestjs
        run: pnpm exec vitest run packages/nestjs

  # Prisma 7 (latest) runs in the test job; this re-runs the Prisma tests on the previous majors.
  prisma-compat:
    name: prisma compat (prisma ${{ matrix.prisma }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        prisma: ['5', '6']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup workspace
        uses: ./.github/actions/setup
        with:
          node-version: 24.x

      # Prisma 5 and 6 still require a url in the datasource block (Prisma 7 rejects it there). This
      # runs before the pin because `pnpm add` triggers the root `prepare` script, which
      # generates the test client with the newly installed Prisma.
      - name: Add the datasource url for Prisma ${{ matrix.prisma }}
        run: >
          sed -i 's/^  provider = "postgresql"$/  provider = "postgresql"\n  url      = env("DATABASE_URL")/'
          packages/postgres/test/prisma/schema.prisma

      # Prisma 5 has no `prisma-client` generator and runs driver adapters as a preview feature. The
      # generate script gives the `prisma-client-js` output the import path the tests use.
      - name: Use the prisma-client-js generator for Prisma 5
        if: matrix.prisma == '5'
        run: >
          sed -i 's/^  provider = "prisma-client"$/  provider        = "prisma-client-js"\n  previewFeatures = ["driverAdapters"]/'
          packages/postgres/test/prisma/schema.prisma

      # CI-only: re-resolve the Prisma dev dependencies of the postgres package to the matrix
      # major. The modified package.json, lockfile and schema are never committed.
      - name: Pin prisma to ${{ matrix.prisma }}
        run: >
          pnpm --filter @relaybus/postgres add --save-dev
          prisma@${{ matrix.prisma }}
          @prisma/client@${{ matrix.prisma }}
          @prisma/adapter-pg@${{ matrix.prisma }}

      - name: Generate the test client
        run: |
          node scripts/generate-test-prisma-client.mjs
          grep -rho '"clientVersion": "[^"]*"' packages/postgres/test/prisma/generated | head -1

      - name: Verify Docker (Testcontainers)
        run: docker version --format '{{.Server.Version}}'

      - name: Test the Prisma adapter
        run: >
          pnpm exec vitest run
          packages/postgres/test/adapters.integration.test.ts
          packages/postgres/test/perf-design-orm-executors.integration.test.ts
          packages/postgres/test/wake-after-commit.integration.test.ts
          packages/postgres/test/prisma-executor.test.ts

  # Single required check for branch protection / rulesets.
  ci-pass:
    name: CI pass
    if: ${{ always() }}
    needs: [quality, test, build, nestjs-compat, prisma-compat]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail when any required job did not succeed
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "true" ]; then
            echo "One or more required jobs did not succeed." >&2
            exit 1
          fi
