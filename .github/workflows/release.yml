name: Release

on:
  push:
    branches: [main, next, beta]

# Releases must never run concurrently and a started release is never cancelled.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Full test gate (quality, tests with 100% coverage, build, Nest compat).
  gate:
    name: gate
    permissions:
      contents: read
      id-token: write # the called workflow's test job uploads to Codecov via OIDC
    uses: ./.github/workflows/ci.yml
    with:
      skip-coverage-upload: true

  # Publishing happens in this job, never inside the reusable workflow: npm
  # Trusted Publishing validates the caller's workflow filename (release.yml).
  release:
    name: release
    needs: gate
    # Off until the packages exist on npm with Trusted Publishers configured
    # (docs/releasing.md). semantic-release pushes the tag before publishing,
    # so running earlier would leave a tag without a published release.
    if: vars.RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Must match the environment configured in the npm Trusted Publisher form.
    environment: npm-publish
    permissions:
      contents: write # push the release tag and create GitHub releases
      issues: write # semantic-release success / fail comments
      pull-requests: write # semantic-release success comments on released PRs
      id-token: write # npm Trusted Publishing (OIDC) and provenance
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # semantic-release needs the full history and all tags to find the
          # last release. It pushes the tag with GITHUB_TOKEN itself.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup workspace
        uses: ./.github/actions/setup
        with:
          node-version: 24.x

      # npm Trusted Publishing needs npm >= 11.5.1.
      - name: Install npm for Trusted Publishing
        run: |
          npm install --global npm@11.20.0
          npm --version
          node -e "const [a,b,c]=process.argv[1].split('.').map(Number); if (a<11||(a===11&&(b<5||(b===5&&c<1)))) { console.error('npm >= 11.5.1 is required'); process.exit(1); }" "$(npm --version)"

      - name: Release
        run: pnpm exec semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No NPM_TOKEN: npm authenticates through OIDC (see docs/releasing.md).
