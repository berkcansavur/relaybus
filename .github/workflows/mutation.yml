name: Mutation testing

on:
  schedule:
    - cron: '17 2 * * 0'
  workflow_dispatch:

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  stryker:
    name: stryker
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup workspace
        uses: ./.github/actions/setup
        with:
          node-version: 24.x

      # Incremental mode: only mutants affected by changes since the last run are
      # re-tested. The cache is keyed per run and restored from the latest one.
      - name: Restore Stryker incremental state
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reports/stryker-incremental.json
          key: stryker-incremental-${{ github.run_id }}
          restore-keys: |
            stryker-incremental-

      # Stryker runs in place (`inPlace: true` in stryker.config.json): it mutates the
      # files of this fresh checkout and restores them afterwards. That keeps the
      # `@relaybus/*` workspace imports on the mutated sources. Safe here because the
      # runner's checkout is disposable.
      # Fails (non-zero exit) when the mutation score drops below thresholds.break.
      - name: Run Stryker
        run: pnpm mutation

      - name: Save Stryker incremental state
        if: ${{ !cancelled() }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reports/stryker-incremental.json
          key: stryker-incremental-${{ github.run_id }}

      - name: Upload mutation report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-report
          path: reports/mutation/
          if-no-files-found: warn
          retention-days: 30
