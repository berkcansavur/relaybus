name: Setup workspace
description: Install pnpm (version from the packageManager field), Node.js with the pnpm store cached, and the frozen-lockfile dependencies.

inputs:
  node-version:
    description: Node.js version to install. Ignored when node-version-file is set.
    required: false
    default: ''
  node-version-file:
    description: File holding the Node.js version (for example .nvmrc).
    required: false
    default: .nvmrc
  install:
    description: Run `pnpm install --frozen-lockfile` after the toolchain is ready.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - name: Install Node.js (explicit version)
      if: ${{ inputs.node-version != '' }}
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm

    - name: Install Node.js (from version file)
      if: ${{ inputs.node-version == '' }}
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: ${{ inputs.node-version-file }}
        cache: pnpm

    - name: Install dependencies
      if: ${{ inputs.install == 'true' }}
      shell: bash
      run: pnpm install --frozen-lockfile
