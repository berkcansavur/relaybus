name: Bug report
description: Something does not work as documented
title: 'bug: '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. For security issues use private vulnerability reporting instead (see SECURITY.md).
  - type: dropdown
    id: package
    attributes:
      label: Package
      multiple: true
      options:
        - '@relaybus/core'
        - '@relaybus/nestjs'
        - '@relaybus/postgres'
        - '@relaybus/mongodb'
        - '@relaybus/kafka'
        - '@relaybus/rabbitmq'
        - '@relaybus/testing'
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Node.js version and OS
      placeholder: Node 24.1.0, Ubuntu 24.04
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Include what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Code or a repository link. Include the event store / transport and its driver version.
      render: typescript
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and stack traces
      render: text
